name: Graph classification pilot

on:
  push:
    branches:
      - graph-classification-pilot
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn torch
      - name: Run pilot
        run: |
          python experiments/graph_classification_pilot.py | tee pilot.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: graph-classification-pilot-results
          path: |
            results/graph_classification_pilot/
            pilot.log
