name: temp-fetch-gse139627-readcount
on:
  push:
    paths:
      - '.github/workflows/fetch_gse139627_readcount_temp.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download GEO read counts
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz \
            https://ftp.ncbi.nlm.nih.gov/geo/series/GSE139nnn/GSE139627/suppl/GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz
          ls -lh GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz
          sha256sum GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz
      - uses: actions/upload-artifact@v4
        with:
          name: GSE139627_Mouse_SmartSeq2_ReadCount
          path: GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz
          retention-days: 1
