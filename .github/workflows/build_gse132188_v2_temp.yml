name: temp-build-gse132188-v2
on:
  push:
    paths:
      - '.github/workflows/build_gse132188_v2_temp.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scanpy==1.10.4" "anndata==0.11.4" pyreadr pandas scipy numpy scikit-learn h5py
      - name: Download public sources
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o source.h5ad \
            https://raw.githubusercontent.com/theislab/scvelo_notebooks/f6cad69fd509be44c8453205309f4c3c3c37ba34/data/Pancreas/endocrinogenesis_day15.h5ad
          curl -L --fail --retry 3 -o dorothea_mm.rda \
            https://raw.githubusercontent.com/saezlab/dorothea/master/data/dorothea_mm.rda
          curl -L --fail --retry 3 -o trrust_rawdata.mouse.tsv \
            https://raw.githubusercontent.com/Cold7/mouse_reference_net/master/trrust_rawdata.mouse.tsv
      - name: Build dataset
        shell: bash
        run: |
          cat > build_gse132188.py <<'PY'
          import os, json, hashlib, shutil
          import numpy as np, pandas as pd, scipy.sparse as sp
          import scanpy as sc, pyreadr

          OUT='GSE132188_prepared'
          os.makedirs(OUT+'/source',exist_ok=True); os.makedirs(OUT+'/scripts',exist_ok=True)

          full=sc.read_h5ad('source.h5ad')
          source_counts=full.obs['clusters'].astype(str).value_counts().to_dict()
          states=['Ngn3 low EP','Ngn3 high EP','Pre-endocrine','Beta']
          ad=full[full.obs['clusters'].astype(str).isin(states).values].copy()

          sc.pp.neighbors(ad,n_neighbors=15,use_rep='X_pca',random_state=0)
          sc.tl.diffmap(ad,n_comps=15)
          start=np.where(ad.obs['clusters'].astype(str).values=='Ngn3 low EP')[0]
          Xp=np.asarray(ad.obsm['X_pca'])[:,:20]
          centroid=Xp[start].mean(axis=0)
          root=int(start[np.argmin(((Xp[start]-centroid)**2).sum(axis=1))])
          ad.uns['iroot']=root
          sc.tl.dpt(ad,n_dcs=10)
          pt=np.asarray(ad.obs['dpt_pseudotime'],dtype=float)
          if not np.isfinite(pt).all(): raise RuntimeError('non-finite DPT')
          pt=(pt-pt.min())/(pt.max()-pt.min()+1e-12)
          ad.obs['dpt_pseudotime']=pt

          X=ad.X.tocsr() if sp.issparse(ad.X) else sp.csr_matrix(ad.X)
          genes=np.asarray(ad.var_names.astype(str)); cells=np.asarray(ad.obs_names.astype(str))
          labels=ad.obs['clusters'].astype(str).values

          rr=pyreadr.read_r('dorothea_mm.rda')
          doro=next(iter(rr.values())).copy(); cmap={str(c).lower():c for c in doro.columns}
          doro=doro[[cmap['tf'],cmap['target'],cmap['mor'],cmap['confidence']]].copy()
          doro.columns=['source','target','mor','confidence']
          doro=doro[doro.confidence.astype(str).isin(['A','B','C'])].copy()
          doro['sign']=np.sign(pd.to_numeric(doro.mor,errors='coerce'))
          doro=doro[doro.sign.isin([-1,1])].copy()
          doro['source_db']='DoRothEA'; doro=doro[['source','target','sign','source_db','confidence']]

          tr=pd.read_csv('trrust_rawdata.mouse.tsv',sep='\t',header=None,names=['source','target','effect','pmid'],dtype=str)
          tr=tr[tr.effect.isin(['Activation','Repression'])].copy()
          tr['sign']=np.where(tr.effect.eq('Activation'),1,-1); tr['source_db']='TRRUST'; tr['confidence']='TRRUST'
          tr=tr[['source','target','sign','source_db','confidence']]

          raw=pd.concat([doro,tr],ignore_index=True)
          raw['source']=raw.source.astype(str).str.strip(); raw['target']=raw.target.astype(str).str.strip()
          raw=raw[raw.source.ne(raw.target)].copy()
          gm={g.upper():g for g in genes}
          raw['source_key']=raw.source.str.upper(); raw['target_key']=raw.target.str.upper()
          raw=raw[raw.source_key.isin(gm)&raw.target_key.isin(gm)].copy()
          raw['source_gene']=raw.source_key.map(gm); raw['target_gene']=raw.target_key.map(gm)

          tf_present=sorted(set(raw.source_gene)); tfset=set(tf_present); gi={g:i for i,g in enumerate(genes)}
          L=X.astype(np.float64).copy(); L.data=np.log2(L.data+1.0)
          mean=np.asarray(L.mean(axis=0)).ravel(); mean2=np.asarray(L.power(2).mean(axis=0)).ravel()
          var=np.maximum(mean2-mean**2,0)
          non_tf=[g for g in genes if g not in tfset]
          non_tf_sorted=sorted(non_tf,key=lambda g:(-var[gi[g]],g))
          chosen_non_tf=non_tf_sorted[:1000]; selected=tf_present+chosen_non_tf; ss=set(selected)

          pr=raw[raw.source_gene.isin(ss)&raw.target_gene.isin(ss)].copy()
          pr['pair']=pr.source_gene+'\t'+pr.target_gene
          conflict=set(pr.groupby('pair').sign.nunique().loc[lambda s:s>1].index)
          pr=pr[~pr.pair.isin(conflict)].copy()
          def collapse(g):
              return pd.Series({'sign':int(g.sign.iloc[0]),'source_db':'+'.join(sorted(set(g.source_db.astype(str)))),
                                'confidence':'+'.join(sorted(set(g.confidence.astype(str))))})
          prov=pr.groupby(['source_gene','target_gene'],sort=True).apply(collapse,include_groups=False).reset_index()
          prov.columns=['source','target','sign','source_db','confidence']
          gold=prov[['source','target','sign']].copy()

          sel=np.array([gi[g] for g in selected],int)
          Xsel=X[:,sel].T.tocsr()
          pd.DataFrame.sparse.from_spmatrix(Xsel,index=selected,columns=cells).to_csv(OUT+'/ExpressionData1000.csv')
          stage=pd.DataFrame({'cell':cells,'state':labels,'pseudotime':pt})
          stage.to_csv(OUT+'/stage_label.csv',index=False); stage[['cell','pseudotime']].to_csv(OUT+'/PseudoTime.csv',index=False)
          pd.DataFrame({'gene':selected,'type':['TF' if g in tfset else 'non-TF' for g in selected],
                        'log2_variance':[float(var[gi[g]]) for g in selected]}).to_csv(OUT+'/GeneOrdering_TFplus1000.csv',index=False)
          pd.DataFrame({'TF':tf_present}).to_csv(OUT+'/TF_retained.csv',index=False)
          gold.to_csv(OUT+'/gold_augmented.csv',index=False); prov.to_csv(OUT+'/gold_augmented_with_provenance.csv',index=False)
          pd.DataFrame({'pair':sorted(conflict)}).to_csv(OUT+'/conflicting_pairs_removed.csv',index=False)

          sa=stage.groupby('state').pseudotime.agg(['count','min','median','mean','max']).reindex(states)
          sa.to_csv(OUT+'/state_pseudotime_audit.csv')
          med=sa['median'].values
          if not np.all(np.diff(med)>0):
              raise RuntimeError(f'pseudotime state medians are not strictly increasing: {med}')

          audit={
            'GEO':'GSE132188','source_cells':int(full.n_obs),'source_genes':int(full.n_vars),
            'source_state_counts':{str(k):int(v) for k,v in source_counts.items()},
            'selected_branch':states,'cells_selected':int(ad.n_obs),
            'state_counts':{s:int((labels==s).sum()) for s in states},
            'excluded_states':['Ductal','Alpha','Delta','Epsilon'],
            'branch_reason':'Use the established endocrine progenitor to Beta lineage; terminal Alpha/Delta/Epsilon are parallel branches and Ductal is outside the locked endocrine trunk used here.',
            'pseudotime':'Scanpy DPT recomputed globally on selected branch; neighbors=15, use_rep=X_pca, n_dcs=10',
            'root_rule':'PCA medoid of Ngn3 low EP in first 20 PCs','root_cell':str(cells[root]),
            'retained_TFs':len(tf_present),'non_TF_genes':1000,'genes_TFplus1000':len(selected),
            'gene_selection':'All signed-prior regulator TFs present in expression + 1000 highest log2(count+1) variance non-TFs',
            'prior_sources':'DoRothEA mouse A/B/C + TRRUST mouse explicit Activation/Repression',
            'prior_activation_edges':int((gold.sign==1).sum()),'prior_repression_edges':int((gold.sign==-1).sum()),
            'prior_recorded_edges':int(len(gold)),'conflicting_ordered_pairs_removed':len(conflict),
            'expression':'raw counts, genes x cells; downstream PSD-GRN applies log2(x+1)'
          }
          with open(OUT+'/audit.json','w') as f: json.dump(audit,f,indent=2)
          shutil.copy2('source.h5ad',OUT+'/source/GSE132188_E15_5_source.h5ad')
          shutil.copy2('dorothea_mm.rda',OUT+'/source/dorothea_mm.rda')
          shutil.copy2('trrust_rawdata.mouse.tsv',OUT+'/source/trrust_rawdata.mouse.tsv')
          shutil.copy2('build_gse132188.py',OUT+'/scripts/build_gse132188.py')
          readme = "# GSE132188 prepared dataset\n\nLocked lineage: Ngn3 low EP -> Ngn3 high EP -> Pre-endocrine -> Beta.\n\nstage_label.csv contains source cell-state labels and a DPT pseudotime recomputed globally on the selected lineage. Ductal and the parallel Alpha/Delta/Epsilon terminal branches are not used in the k-window audit.\n\nExpressionData1000.csv is raw count expression for all retained TFs plus the 1000 highest-variance non-TF genes. gold_augmented.csv is the signed-directed reference network from DoRothEA mouse A/B/C plus TRRUST explicit Activation/Repression, restricted to the selected node set with conflicting ordered-pair signs removed.\n"
          open(OUT+'/README.md','w').write(readme)

          rows=[]
          for rd,_,fns in os.walk(OUT):
              for fn in sorted(fns):
                  p=os.path.join(rd,fn); rows.append({'path':os.path.relpath(p,OUT),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'bytes':os.path.getsize(p)})
          pd.DataFrame(rows).to_csv(OUT+'/checksums.csv',index=False)
          print(json.dumps(audit,indent=2)); print(sa)
          PY
          python build_gse132188.py
          cp build_gse132188.py GSE132188_prepared/scripts/build_gse132188.py
          zip -qr GSE132188_prepared.zip GSE132188_prepared
          sha256sum GSE132188_prepared.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GSE132188_prepared_v2
          path: GSE132188_prepared.zip
          retention-days: 1
