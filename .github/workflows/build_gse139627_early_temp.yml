name: temp-build-gse139627-early
on:
  push:
    paths:
      - '.github/workflows/build_gse139627_early_temp.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "scanpy==1.10.4" "anndata==0.11.4" pyreadr pandas scipy numpy scikit-learn openpyxl
      - name: Download public sources
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o TableS1.xlsx             'https://static-content.springer.com/esm/art%3A10.1038%2Fs41422-021-00486-w/MediaObjects/41422_2021_486_MOESM11_ESM.xlsx'
          curl -L --fail --retry 3 -o SmartSeq2.TPM.txt.gz             'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE139nnn/GSE139627/suppl/GSE139627_Mouse_SmartSeq2.TPM.txt.gz'
          curl -L --fail --retry 3 -o dorothea_mm.rda             'https://raw.githubusercontent.com/saezlab/dorothea/master/data/dorothea_mm.rda'
          curl -L --fail --retry 3 -o trrust_rawdata.mouse.tsv             'https://raw.githubusercontent.com/Cold7/mouse_reference_net/master/trrust_rawdata.mouse.tsv'
      - name: Build early branch
        shell: bash
        run: |
          cat > build_gse139627_early.py <<'PY'
          import os, json, hashlib, shutil, gzip
          import numpy as np, pandas as pd, scipy.sparse as sp
          import scanpy as sc, anndata as ad, pyreadr

          OUT='GSE139627_early_prepared'
          os.makedirs(OUT+'/source',exist_ok=True); os.makedirs(OUT+'/scripts',exist_ok=True)

          ann=pd.read_excel('TableS1.xlsx',sheet_name='Sheet1',header=3,usecols='A:M')
          ann=ann.dropna(subset=['Sample','Putative Cell Type']).copy()
          current=~ann['Note'].fillna('').astype(str).str.contains('GSE115931',case=False)
          states=['EP3','EP4early','βearly']
          selann=ann[current & ann['Putative Cell Type'].isin(states)].copy()
          selann=selann[['Sample','Cell Source','Developmental Time','Region','Batch','Putative Cell Type','Note']]
          selann['Sample']=selann['Sample'].astype(str)
          selected_cells=selann['Sample'].tolist()

          # Match selected author-annotated cells to GEO TPM columns.
          with gzip.open('SmartSeq2.TPM.txt.gz','rt') as f:
              hdr=f.readline().rstrip('\n').split('\t')
          gene_col=hdr[0]
          header_cells=hdr[1:]
          missing=sorted(set(selected_cells)-set(header_cells))
          present=[c for c in selected_cells if c in set(header_cells)]
          if missing:
              print('MISSING_ANNOTATED_CELLS',len(missing),missing[:30])
          print('selected annotated',len(selected_cells),'matched TPM',len(present))
          # Require essentially complete direct match; a material mismatch indicates wrong source.
          if len(present) < 0.98*len(selected_cells):
              raise RuntimeError(f'too many annotation/TPM mismatches: {len(present)}/{len(selected_cells)}')

          use=[gene_col]+present
          tpm=pd.read_csv('SmartSeq2.TPM.txt.gz',sep='\t',compression='gzip',usecols=use,index_col=0)
          tpm.index=tpm.index.astype(str)
          # Collapse duplicate gene symbols if any.
          if tpm.index.duplicated().any():
              tpm=tpm.groupby(level=0).mean()
          # Reorder cells to annotation order after direct matching.
          selann=selann[selann.Sample.isin(tpm.columns)].copy()
          cells=selann.Sample.tolist()
          tpm=tpm[cells]
          labels=selann.set_index('Sample').loc[cells,'Putative Cell Type'].astype(str).values

          # DPT from log2(TPM+1), top 2000 variance genes on this branch.
          Xlog=np.log2(tpm.T.to_numpy(dtype=np.float32)+1.0)
          var=Xlog.var(axis=0)
          hv=np.argsort(-var)[:min(2000,Xlog.shape[1])]
          adata=ad.AnnData(X=Xlog[:,hv],obs=pd.DataFrame(index=cells))
          adata.obs['state']=labels
          sc.pp.scale(adata,max_value=10)
          sc.tl.pca(adata,n_comps=min(50,adata.n_vars-1),svd_solver='arpack',random_state=0)
          sc.pp.neighbors(adata,n_neighbors=15,n_pcs=min(30,adata.obsm['X_pca'].shape[1]),random_state=0)
          sc.tl.diffmap(adata,n_comps=15)
          ep3=np.where(labels=='EP3')[0]
          pc=np.asarray(adata.obsm['X_pca'])[:,:20]
          cen=pc[ep3].mean(axis=0)
          root=int(ep3[np.argmin(((pc[ep3]-cen)**2).sum(axis=1))])
          adata.uns['iroot']=root
          sc.tl.dpt(adata,n_dcs=10)
          pt=np.asarray(adata.obs['dpt_pseudotime'],float)
          if not np.isfinite(pt).all(): raise RuntimeError('non-finite DPT')
          pt=(pt-pt.min())/(pt.max()-pt.min()+1e-12)

          # Signed mouse prior: DoRothEA A/B/C + TRRUST explicit activation/repression.
          rr=pyreadr.read_r('dorothea_mm.rda')
          doro=next(iter(rr.values())).copy(); cmap={str(c).lower():c for c in doro.columns}
          doro=doro[[cmap['tf'],cmap['target'],cmap['mor'],cmap['confidence']]].copy()
          doro.columns=['source','target','mor','confidence']
          doro=doro[doro.confidence.astype(str).isin(['A','B','C'])].copy()
          doro['sign']=np.sign(pd.to_numeric(doro.mor,errors='coerce'))
          doro=doro[doro.sign.isin([-1,1])].copy(); doro['source_db']='DoRothEA'
          doro=doro[['source','target','sign','source_db','confidence']]
          tr=pd.read_csv('trrust_rawdata.mouse.tsv',sep='\t',header=None,names=['source','target','effect','pmid'],dtype=str)
          tr=tr[tr.effect.isin(['Activation','Repression'])].copy()
          tr['sign']=np.where(tr.effect.eq('Activation'),1,-1); tr['source_db']='TRRUST'; tr['confidence']='TRRUST'
          tr=tr[['source','target','sign','source_db','confidence']]
          raw=pd.concat([doro,tr],ignore_index=True)
          raw['source']=raw.source.astype(str).str.strip(); raw['target']=raw.target.astype(str).str.strip()
          raw=raw[raw.source.ne(raw.target)].copy()

          genes=np.asarray(tpm.index.astype(str))
          gm={g.upper():g for g in genes}
          raw['source_key']=raw.source.str.upper(); raw['target_key']=raw.target.str.upper()
          raw=raw[raw.source_key.isin(gm)&raw.target_key.isin(gm)].copy()
          raw['source_gene']=raw.source_key.map(gm); raw['target_gene']=raw.target_key.map(gm)

          tf_present=sorted(set(raw.source_gene)); tfset=set(tf_present)
          gi={g:i for i,g in enumerate(genes)}
          allvar=np.log2(tpm.to_numpy(dtype=np.float64)+1.0).var(axis=1)
          non_tf=[g for g in genes if g not in tfset]
          non_tf_sorted=sorted(non_tf,key=lambda g:(-allvar[gi[g]],g))
          chosen_non_tf=non_tf_sorted[:1000]
          selected=tf_present+chosen_non_tf; ss=set(selected)

          pr=raw[raw.source_gene.isin(ss)&raw.target_gene.isin(ss)].copy()
          pr['pair']=pr.source_gene+'\t'+pr.target_gene
          conflict=set(pr.groupby('pair').sign.nunique().loc[lambda s:s>1].index)
          pr=pr[~pr.pair.isin(conflict)].copy()
          def collapse(g):
              return pd.Series({'sign':int(g.sign.iloc[0]),'source_db':'+'.join(sorted(set(g.source_db.astype(str)))),
                                'confidence':'+'.join(sorted(set(g.confidence.astype(str))))})
          prov=pr.groupby(['source_gene','target_gene'],sort=True).apply(collapse,include_groups=False).reset_index()
          prov.columns=['source','target','sign','source_db','confidence']
          gold=prov[['source','target','sign']].copy()

          # Save PSD-GRN-ready expression as TPM (gene x cell); local-group code applies log2(x+1).
          tpm.loc[selected,cells].to_csv(OUT+'/ExpressionData1000.csv')
          stage=pd.DataFrame({'cell':cells,'state':labels,'pseudotime':pt})
          stage.to_csv(OUT+'/stage_label.csv',index=False)
          stage[['cell','pseudotime']].to_csv(OUT+'/PseudoTime.csv',index=False)
          selann.to_csv(OUT+'/source_cell_annotation.csv',index=False)
          pd.DataFrame({'gene':selected,'type':['TF' if g in tfset else 'non-TF' for g in selected],
                        'log2TPM_variance':[float(allvar[gi[g]]) for g in selected]}).to_csv(OUT+'/GeneOrdering_TFplus1000.csv',index=False)
          pd.DataFrame({'TF':tf_present}).to_csv(OUT+'/TF_retained.csv',index=False)
          gold.to_csv(OUT+'/gold_augmented.csv',index=False)
          prov.to_csv(OUT+'/gold_augmented_with_provenance.csv',index=False)
          pd.DataFrame({'pair':sorted(conflict)}).to_csv(OUT+'/conflicting_pairs_removed.csv',index=False)

          sa=stage.groupby('state').pseudotime.agg(['count','min','median','mean','max']).reindex(states)
          sa.to_csv(OUT+'/state_pseudotime_audit.csv')
          # Require correct global orientation at the state-median level.
          med=sa['median'].values
          if not np.all(np.diff(med)>0):
              raise RuntimeError(f'DPT medians not increasing EP3->EP4early->betaearly: {med}')

          audit={
            'GEO':'GSE139627','technology':'Smart-seq2','selected_branch':states,
            'branch_source':'author cell-state labels from Supplementary Table S1',
            'exclude_downloaded_GSE115931':True,
            'cells_selected':int(len(cells)),
            'state_counts':{s:int((labels==s).sum()) for s in states},
            'pseudotime':'Scanpy DPT recomputed on selected early branch from log2(TPM+1); top-2000 variance genes; neighbors=15; root=EP3 PCA medoid',
            'root_cell':str(cells[root]),
            'expression':'author GEO TPM; ExpressionData1000.csv stores TPM, downstream local feature construction applies log2(x+1)',
            'retained_TFs':int(len(tf_present)),'non_TF_genes':1000,'genes_TFplus1000':int(len(selected)),
            'gene_selection':'all signed-prior regulator TFs present in branch expression + 1000 highest log2(TPM+1) variance non-TFs',
            'prior_sources':'DoRothEA mouse A/B/C + TRRUST mouse explicit Activation/Repression',
            'prior_activation_edges':int((gold.sign==1).sum()),'prior_repression_edges':int((gold.sign==-1).sum()),
            'prior_recorded_edges':int(len(gold)),'conflicting_ordered_pairs_removed':int(len(conflict)),
            'annotation_TPM_missing_cells':missing
          }
          with open(OUT+'/audit.json','w') as f: json.dump(audit,f,indent=2,ensure_ascii=False)
          open(OUT+'/README.md','w').write(
              '# GSE139627 Smart-seq2 early branch\n\n'
              'Locked branch: EP3 -> EP4early -> betaearly. Only cells generated in GSE139627 are used; cells marked as downloaded from GSE115931 in Supplementary Table S1 are excluded.\n\n'
              'ExpressionData1000.csv contains author GEO TPM values for a TF+1000 node set. stage_label.csv contains author state labels plus a branch-specific DPT pseudotime reconstructed from log2(TPM+1). gold_augmented.csv contains the mouse signed-directed reference network restricted to the selected node set.\n'
          )
          shutil.copy2('TableS1.xlsx',OUT+'/source/GSE139627_TableS1.xlsx')
          shutil.copy2('dorothea_mm.rda',OUT+'/source/dorothea_mm.rda')
          shutil.copy2('trrust_rawdata.mouse.tsv',OUT+'/source/trrust_rawdata.mouse.tsv')
          shutil.copy2('build_gse139627_early.py',OUT+'/scripts/build_gse139627_early.py')
          # source URL/checksum record instead of duplicating 56MB TPM into core package
          sha=hashlib.sha256(open('SmartSeq2.TPM.txt.gz','rb').read()).hexdigest()
          open(OUT+'/source/SmartSeq2_TPM_source.txt','w').write(
              'URL=https://ftp.ncbi.nlm.nih.gov/geo/series/GSE139nnn/GSE139627/suppl/GSE139627_Mouse_SmartSeq2.TPM.txt.gz\n'
              f'SHA256={sha}\n'
          )
          rows=[]
          for rd,_,fns in os.walk(OUT):
              for fn in sorted(fns):
                  p=os.path.join(rd,fn); rows.append({'path':os.path.relpath(p,OUT),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'bytes':os.path.getsize(p)})
          pd.DataFrame(rows).to_csv(OUT+'/checksums.csv',index=False)
          print(json.dumps(audit,indent=2,ensure_ascii=False)); print(sa)
          PY
          python build_gse139627_early.py | tee build_log.txt
          cp build_gse139627_early.py GSE139627_early_prepared/scripts/build_gse139627_early.py
          zip -qr GSE139627_early_prepared.zip GSE139627_early_prepared build_log.txt
          sha256sum GSE139627_early_prepared.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GSE139627_early_prepared
          path: GSE139627_early_prepared.zip
          retention-days: 1
