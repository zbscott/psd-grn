name: temp-build-gse139627-early
on:
  push:
    paths:
      - '.github/workflows/build_gse139627_early_temp.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scanpy==1.10.4" "anndata==0.11.4" pyreadr pandas scipy numpy scikit-learn h5py openpyxl
      - name: Download public source files
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz \
            https://ftp.ncbi.nlm.nih.gov/geo/series/GSE139nnn/GSE139627/suppl/GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz
          curl -L --fail --retry 3 -o GSE139627_TableS1.xlsx \
            'https://static-content.springer.com/esm/art%3A10.1038%2Fs41422-021-00486-w/MediaObjects/41422_2021_486_MOESM11_ESM.xlsx'
          curl -L --fail --retry 3 -o dorothea_mm.rda \
            https://raw.githubusercontent.com/saezlab/dorothea/master/data/dorothea_mm.rda
          curl -L --fail --retry 3 -o trrust_rawdata.mouse.tsv \
            https://raw.githubusercontent.com/Cold7/mouse_reference_net/master/trrust_rawdata.mouse.tsv
          sha256sum GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz GSE139627_TableS1.xlsx dorothea_mm.rda trrust_rawdata.mouse.tsv
      - name: Build branch-specific reproducible dataset
        shell: bash
        run: |
          cat > build_gse139627_early.py <<'PY'
          import os, json, hashlib, shutil, gzip, re
          import numpy as np, pandas as pd, scipy.sparse as sp
          import scanpy as sc, pyreadr, openpyxl

          OUT='GSE139627_early_prepared'
          os.makedirs(OUT+'/source',exist_ok=True)
          os.makedirs(OUT+'/scripts',exist_ok=True)
          os.makedirs(OUT+'/groups',exist_ok=True)

          # ---------- 1. Author-provided cell annotation ----------
          wb=openpyxl.load_workbook('GSE139627_TableS1.xlsx',read_only=True,data_only=True)
          ws=wb['Sheet1']
          rows=list(ws.iter_rows(min_row=5,values_only=True))
          meta=pd.DataFrame([{
              'cell':str(r[0]).strip(),
              'cell_source':r[1],
              'developmental_time':str(r[2]).strip() if r[2] is not None else '',
              'batch':r[4],
              'detected_genes':r[10],
              'state':str(r[11]).strip() if r[11] is not None else '',
              'note':str(r[12]).strip() if r[12] is not None else ''
          } for r in rows if r[0] is not None and r[11] is not None])

          states=['EP3','EP4early','βearly']
          # Exclude the 700 cells explicitly marked as downloaded from GSE115931.
          branch=meta[meta['state'].isin(states) & ~meta['note'].str.contains('GSE115931',na=False)].copy()
          branch=branch.drop_duplicates('cell').reset_index(drop=True)
          expected={'EP3':227,'EP4early':180,'βearly':181}
          got=branch['state'].value_counts().to_dict()
          if got != expected:
              raise RuntimeError(f'Unexpected branch state counts: {got} != {expected}')

          # ---------- 2. Read only branch columns from GEO count matrix ----------
          with gzip.open('GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz','rt') as f:
              header=f.readline().rstrip('\n').split('\t')
          first_col=header[0]
          hset=set(header[1:])
          missing=sorted(set(branch.cell)-hset)
          if missing:
              raise RuntimeError(f'{len(missing)} branch cells missing from GEO read-count header; examples={missing[:10]}')
          usecols=[first_col]+branch.cell.tolist()
          counts=pd.read_csv('GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz',sep='\t',compression='gzip',usecols=usecols)
          counts=counts.rename(columns={first_col:'gene'})
          counts['gene']=counts['gene'].astype(str).str.strip()
          counts=counts[counts.gene.ne('')].copy()
          # Aggregate duplicate symbols deterministically if present.
          dup_n=int(counts.gene.duplicated().sum())
          if dup_n:
              counts=counts.groupby('gene',as_index=False,sort=True).sum(numeric_only=True)
          counts=counts.set_index('gene')
          counts=counts.loc[:,branch.cell.tolist()]
          # remove genes with zero counts over selected branch
          counts=counts.loc[counts.sum(axis=1)>0]
          genes=np.asarray(counts.index.astype(str))
          cells=np.asarray(branch.cell.astype(str))

          # ---------- 3. Branch-specific pseudotime ----------
          # Use normalized/log1p expression for trajectory construction only.
          X=sp.csr_matrix(counts.T.values,dtype=np.float32)
          ad=sc.AnnData(X=X,obs=branch.set_index('cell').loc[cells].copy(),var=pd.DataFrame(index=genes))
          sc.pp.normalize_total(ad,target_sum=1e4)
          sc.pp.log1p(ad)

          # deterministic top-3000 variable genes on log-normalized expression
          mu=np.asarray(ad.X.mean(axis=0)).ravel()
          mu2=np.asarray(ad.X.power(2).mean(axis=0)).ravel() if sp.issparse(ad.X) else np.asarray((ad.X**2).mean(axis=0)).ravel()
          vv=np.maximum(mu2-mu**2,0)
          top=min(3000,ad.n_vars)
          hv=np.argsort(-vv,kind='mergesort')[:top]
          ad_hv=ad[:,hv].copy()
          sc.pp.scale(ad_hv,max_value=10)
          sc.tl.pca(ad_hv,n_comps=min(50,ad_hv.n_obs-1,ad_hv.n_vars-1),svd_solver='arpack',random_state=0)
          sc.pp.neighbors(ad_hv,n_neighbors=15,n_pcs=min(30,ad_hv.obsm['X_pca'].shape[1]),random_state=0)
          sc.tl.diffmap(ad_hv,n_comps=15)

          # Biological root: medoid of the earliest developmental-time EP3 cells.
          ep3=np.where(ad_hv.obs['state'].astype(str).values=='EP3')[0]
          times=ad_hv.obs['developmental_time'].astype(str).values
          def tnum(s):
              m=re.search(r'(\d+(?:\.\d+)?)',s)
              return float(m.group(1)) if m else 1e9
          tvals=np.array([tnum(x) for x in times])
          earliest=float(np.min(tvals[ep3]))
          root_pool=ep3[np.isclose(tvals[ep3],earliest)]
          pcs=np.asarray(ad_hv.obsm['X_pca'])[:,:20]
          ctr=pcs[root_pool].mean(axis=0)
          root=int(root_pool[np.argmin(((pcs[root_pool]-ctr)**2).sum(axis=1))])
          ad_hv.uns['iroot']=root
          sc.tl.dpt(ad_hv,n_dcs=10)
          pt=np.asarray(ad_hv.obs['dpt_pseudotime'],float)
          if not np.isfinite(pt).all():
              raise RuntimeError('DPT produced non-finite pseudotime')
          pt=(pt-pt.min())/(pt.max()-pt.min()+1e-12)

          branch=branch.set_index('cell').loc[cells].reset_index()
          branch['pseudotime']=pt
          state_audit=branch.groupby('state').pseudotime.agg(['count','min','median','mean','max']).reindex(states)
          # Require the state-level trajectory orientation to be correct.
          med=state_audit['median'].values
          if not np.all(np.diff(med)>0):
              raise RuntimeError(f'State median pseudotime not increasing EP3->EP4early->betaearly: {med}')

          # ---------- 4. Mouse signed-directed prior ----------
          rr=pyreadr.read_r('dorothea_mm.rda')
          if len(rr)!=1: raise RuntimeError(f'Unexpected DoRothEA objects: {list(rr)}')
          doro=next(iter(rr.values())).copy()
          cmap={str(c).lower():c for c in doro.columns}
          doro=doro[[cmap['tf'],cmap['target'],cmap['mor'],cmap['confidence']]].copy()
          doro.columns=['source','target','mor','confidence']
          doro=doro[doro.confidence.astype(str).isin(['A','B','C'])].copy()
          doro['sign']=np.sign(pd.to_numeric(doro.mor,errors='coerce'))
          doro=doro[doro.sign.isin([-1,1])].copy()
          doro['source_db']='DoRothEA'
          doro=doro[['source','target','sign','source_db','confidence']]

          tr=pd.read_csv('trrust_rawdata.mouse.tsv',sep='\t',header=None,
                         names=['source','target','effect','pmid'],dtype=str)
          tr=tr[tr.effect.isin(['Activation','Repression'])].copy()
          tr['sign']=np.where(tr.effect.eq('Activation'),1,-1)
          tr['source_db']='TRRUST'; tr['confidence']='TRRUST'
          tr=tr[['source','target','sign','source_db','confidence']]

          prior=pd.concat([doro,tr],ignore_index=True)
          prior['source']=prior.source.astype(str).str.strip()
          prior['target']=prior.target.astype(str).str.strip()
          prior=prior[prior.source.ne(prior.target)].copy()

          gene_map={g.upper():g for g in genes}
          prior['source_key']=prior.source.str.upper()
          prior['target_key']=prior.target.str.upper()
          prior=prior[prior.source_key.isin(gene_map)&prior.target_key.isin(gene_map)].copy()
          prior['source_gene']=prior.source_key.map(gene_map)
          prior['target_gene']=prior.target_key.map(gene_map)

          # ---------- 5. TF+1000 node set ----------
          tf_present=sorted(set(prior.source_gene))
          tfset=set(tf_present)
          # PSD-GRN-matched log2(count+1) variance on the branch.
          logc=np.log2(counts.values.astype(np.float64)+1.0)
          var=logc.var(axis=1,ddof=0)
          gi={g:i for i,g in enumerate(genes)}
          non_tf=[g for g in genes if g not in tfset]
          non_tf_sorted=sorted(non_tf,key=lambda g:(-var[gi[g]],g))
          chosen_non_tf=non_tf_sorted[:1000]
          selected=tf_present+chosen_non_tf
          selected_set=set(selected)

          pr=prior[prior.source_gene.isin(selected_set)&prior.target_gene.isin(selected_set)].copy()
          pr['pair']=pr.source_gene+'\t'+pr.target_gene
          conflict=set(pr.groupby('pair').sign.nunique().loc[lambda s:s>1].index)
          pr=pr[~pr.pair.isin(conflict)].copy()

          def collapse(g):
              return pd.Series({
                  'sign':int(g.sign.iloc[0]),
                  'source_db':'+'.join(sorted(set(g.source_db.astype(str)))),
                  'confidence':'+'.join(sorted(set(g.confidence.astype(str))))
              })
          prov=pr.groupby(['source_gene','target_gene'],sort=True).apply(collapse,include_groups=False).reset_index()
          prov.columns=['source','target','sign','source_db','confidence']
          gold=prov[['source','target','sign']].copy()

          # ---------- 6. Write locked-format data ----------
          expr=counts.loc[selected,cells]
          expr.to_csv(OUT+'/ExpressionData1000.csv')
          stage=branch[['cell','state','pseudotime','developmental_time','cell_source','batch']].copy()
          stage.to_csv(OUT+'/stage_label.csv',index=False)
          stage[['cell','pseudotime']].to_csv(OUT+'/PseudoTime.csv',index=False)
          pd.DataFrame({'gene':selected,
                        'type':['TF' if g in tfset else 'non-TF' for g in selected],
                        'log2_variance':[float(var[gi[g]]) for g in selected]}).to_csv(OUT+'/GeneOrdering_TFplus1000.csv',index=False)
          pd.DataFrame({'TF':tf_present}).to_csv(OUT+'/TF_retained.csv',index=False)
          gold.to_csv(OUT+'/gold_augmented.csv',index=False)
          prov.to_csv(OUT+'/gold_augmented_with_provenance.csv',index=False)
          pd.DataFrame({'pair':sorted(conflict)}).to_csv(OUT+'/conflicting_pairs_removed.csv',index=False)
          state_audit.to_csv(OUT+'/state_pseudotime_audit.csv')

          # Locked grouping manifests for k sensitivity.
          group_summary=[]
          for k in [10,15,20,25,30]:
              out=[]
              gid=0
              for s in states:
                  d=stage[stage.state.eq(s)].sort_values(['pseudotime','cell']).reset_index(drop=True)
                  R=int(round(len(d)/k))
                  R=max(R,1)
                  idxs=np.array_split(np.arange(len(d)),R)
                  for local,ix in enumerate(idxs):
                      dd=d.iloc[ix]
                      for _,r in dd.iterrows():
                          out.append({'k':k,'group_id':gid,'state':s,'local_group':local,
                                      'cell':r.cell,'pseudotime':r.pseudotime})
                      group_summary.append({'k':k,'state':s,'local_group':local,'group_id':gid,
                                            'n_cells':len(dd),'pt_min':dd.pseudotime.min(),
                                            'pt_max':dd.pseudotime.max(),'pt_span':dd.pseudotime.max()-dd.pseudotime.min()})
                      gid+=1
              pd.DataFrame(out).to_csv(f'{OUT}/groups/k{k}_group_manifest.csv',index=False)
          gs=pd.DataFrame(group_summary)
          gs.to_csv(OUT+'/groups/k_group_summary.csv',index=False)

          audit={
              'GEO':'GSE139627',
              'platform':'mouse Smart-seq2',
              'branch':['EP3','EP4early','βearly'],
              'source_policy':'Use only cells generated in GSE139627; exclude cells explicitly marked Downloaded from GSE115931.',
              'cells':int(len(stage)),
              'state_counts':{s:int((stage.state==s).sum()) for s in states},
              'root_rule':'PCA medoid among earliest-developmental-time EP3 cells',
              'root_cell':str(cells[root]),
              'root_developmental_time':str(times[root]),
              'pseudotime':'Scanpy DPT on selected branch, after normalize_total(1e4), log1p, top-3000 variance genes, PCA, 15-NN; n_dcs=10',
              'source_gene_rows_after_zero_filter':int(len(genes)),
              'duplicate_gene_rows_aggregated':dup_n,
              'retained_TFs':int(len(tf_present)),
              'non_TF_genes':int(len(chosen_non_tf)),
              'genes_TFplus1000':int(len(selected)),
              'gene_selection':'All signed-prior regulator TFs present in expression plus 1000 highest-variance non-TF genes using log2(count+1), ddof=0.',
              'prior_sources':'DoRothEA mouse confidence A/B/C plus TRRUST mouse explicit Activation/Repression',
              'prior_activation_edges':int((gold.sign==1).sum()),
              'prior_repression_edges':int((gold.sign==-1).sum()),
              'prior_recorded_edges':int(len(gold)),
              'conflicting_ordered_pairs_removed':int(len(conflict)),
              'expression':'GEO HTSeq read counts, genes x cells; downstream PSD-GRN applies log2(x+1).'
          }
          with open(OUT+'/audit.json','w') as f: json.dump(audit,f,indent=2,ensure_ascii=False)

          readme = """# GSE139627 early-branch prepared dataset

Locked branch:
EP3 -> EP4early -> betaearly

Only cells generated in GSE139627 are retained. Cells explicitly marked in Supplementary Table S1 as downloaded from GSE115931 are excluded.

Files:
- ExpressionData1000.csv: GEO HTSeq read counts for the locked TF+1000 node set.
- stage_label.csv: author cell-state labels plus branch-specific DPT pseudotime and developmental metadata.
- PseudoTime.csv: cell and pseudotime.
- gold_augmented.csv: signed-directed reference network.
- groups/: locked non-overlapping contiguous groups for k=10,15,20,25,30.
- source/: exact public upstream files.
- scripts/build_gse139627_early.py: complete rebuild script.
"""
          open(OUT+'/README.md','w').write(readme)

          shutil.copy2('GSE139627_Mouse_SmartSeq2.ReadCount.txt.gz',OUT+'/source/')
          shutil.copy2('GSE139627_TableS1.xlsx',OUT+'/source/')
          shutil.copy2('dorothea_mm.rda',OUT+'/source/')
          shutil.copy2('trrust_rawdata.mouse.tsv',OUT+'/source/')
          shutil.copy2('build_gse139627_early.py',OUT+'/scripts/')

          rows=[]
          for rd,_,fns in os.walk(OUT):
              for fn in sorted(fns):
                  p=os.path.join(rd,fn)
                  rows.append({'path':os.path.relpath(p,OUT),
                               'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),
                               'bytes':os.path.getsize(p)})
          pd.DataFrame(rows).to_csv(OUT+'/checksums.csv',index=False)
          print(json.dumps(audit,indent=2,ensure_ascii=False))
          print(state_audit)
          print('\nK GROUP COUNTS')
          print(gs.groupby(['k','state']).size().unstack(fill_value=0))
          PY
          python build_gse139627_early.py
          zip -qr GSE139627_early_prepared.zip GSE139627_early_prepared
          sha256sum GSE139627_early_prepared.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GSE139627_early_prepared
          path: GSE139627_early_prepared.zip
          retention-days: 1
