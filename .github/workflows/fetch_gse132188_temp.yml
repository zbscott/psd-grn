name: temp-fetch-gse132188
on:
  push:
    paths:
      - '.github/workflows/fetch_gse132188_temp.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download GSE132188 E15.5 source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o GSE132188_E15_5_source.h5ad             https://raw.githubusercontent.com/theislab/scvelo_notebooks/f6cad69fd509be44c8453205309f4c3c3c37ba34/data/Pancreas/endocrinogenesis_day15.h5ad
          sha256sum GSE132188_E15_5_source.h5ad
      - name: Upload source h5ad
        uses: actions/upload-artifact@v4
        with:
          name: GSE132188_E15_5_source
          path: GSE132188_E15_5_source.h5ad
          retention-days: 1
