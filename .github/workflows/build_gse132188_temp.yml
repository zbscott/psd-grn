name: temp-build-gse132188
on:
  push:
    paths:
      - '.github/workflows/build_gse132188_temp.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scanpy==1.10.4" "anndata==0.11.4" pyreadr pandas scipy numpy scikit-learn h5py
      - name: Download public sources
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o source.h5ad \
            https://raw.githubusercontent.com/theislab/scvelo_notebooks/f6cad69fd509be44c8453205309f4c3c3c37ba34/data/Pancreas/endocrinogenesis_day15.h5ad
          curl -L --fail --retry 3 -o dorothea_mm.rda \
            https://raw.githubusercontent.com/saezlab/dorothea/master/data/dorothea_mm.rda
          curl -L --fail --retry 3 -o trrust_rawdata.mouse.tsv \
            https://raw.githubusercontent.com/Cold7/mouse_reference_net/master/trrust_rawdata.mouse.tsv
      - name: Build reproducible GSE132188 package
        shell: bash
        run: |
          cat > build_gse132188.py <<'PY'
          import os, json, hashlib, shutil
          import numpy as np
          import pandas as pd
          import scipy.sparse as sp
          import scanpy as sc
          import pyreadr
          from sklearn.preprocessing import StandardScaler

          OUT='GSE132188_prepared'
          os.makedirs(OUT,exist_ok=True)
          os.makedirs(OUT+'/source',exist_ok=True)
          os.makedirs(OUT+'/scripts',exist_ok=True)

          src='source.h5ad'
          ad=sc.read_h5ad(src)
          target_states=['Ductal','Ngn3 low EP','Ngn3 high EP','Pre-endocrine','Beta']
          mask=ad.obs['clusters'].astype(str).isin(target_states).values
          ad=ad[mask].copy()

          # DPT on the selected continuous Ductal -> endocrine -> Beta branch.
          # Recompute neighbors on the retained cells using the precomputed 50-PC representation.
          sc.pp.neighbors(ad,n_neighbors=15,use_rep='X_pca',random_state=0)
          sc.tl.diffmap(ad,n_comps=15)

          # Deterministic biological root: PCA medoid of Ductal cells.
          duct=np.where(ad.obs['clusters'].astype(str).values=='Ductal')[0]
          Xp=np.asarray(ad.obsm['X_pca'])[:,:20]
          centroid=Xp[duct].mean(axis=0)
          root=int(duct[np.argmin(((Xp[duct]-centroid)**2).sum(axis=1))])
          ad.uns['iroot']=root
          sc.tl.dpt(ad,n_dcs=10)
          pt=np.asarray(ad.obs['dpt_pseudotime'],dtype=float)
          # Guard against pathological non-finite values.
          if not np.isfinite(pt).all():
              raise RuntimeError('non-finite DPT values')
          pt=(pt-pt.min())/(pt.max()-pt.min()+1e-12)
          ad.obs['dpt_pseudotime']=pt

          # Read expression counts. In this source X is integer-like count data.
          X=ad.X.tocsr() if sp.issparse(ad.X) else sp.csr_matrix(ad.X)
          genes=np.asarray(ad.var_names.astype(str))
          cells=np.asarray(ad.obs_names.astype(str))
          states=ad.obs['clusters'].astype(str).values

          # Read DoRothEA mouse regulons and retain A/B/C confidence.
          rr=pyreadr.read_r('dorothea_mm.rda')
          if len(rr)!=1:
              raise RuntimeError(f'unexpected dorothea objects: {list(rr)}')
          doro=next(iter(rr.values())).copy()
          doro.columns=[str(c) for c in doro.columns]
          cmap={c.lower():c for c in doro.columns}
          tfcol=cmap.get('tf') or cmap.get('source')
          tgcol=cmap.get('target')
          morcol=cmap.get('mor') or cmap.get('weight')
          confcol=cmap.get('confidence')
          if not all([tfcol,tgcol,morcol,confcol]):
              raise RuntimeError(f'unexpected dorothea columns: {list(doro.columns)}')
          doro=doro[[tfcol,tgcol,morcol,confcol]].copy()
          doro.columns=['source','target','mor','confidence']
          doro=doro[doro.confidence.astype(str).isin(['A','B','C'])].copy()
          doro['sign']=np.sign(pd.to_numeric(doro['mor'],errors='coerce'))
          doro=doro[doro.sign.isin([-1,1])].copy()
          doro['source_db']='DoRothEA'
          doro=doro[['source','target','sign','source_db','confidence']]

          # Read TRRUST mouse and retain only explicit Activation/Repression.
          tr=pd.read_csv('trrust_rawdata.mouse.tsv',sep='\t',header=None,names=['source','target','effect','pmid'],dtype=str)
          tr=tr[tr.effect.isin(['Activation','Repression'])].copy()
          tr['sign']=np.where(tr.effect.eq('Activation'),1,-1)
          tr['source_db']='TRRUST'
          tr['confidence']='TRRUST'
          tr=tr[['source','target','sign','source_db','confidence']]

          prior_all=pd.concat([doro,tr],ignore_index=True)
          prior_all['source']=prior_all.source.astype(str).str.strip()
          prior_all['target']=prior_all.target.astype(str).str.strip()
          prior_all=prior_all[prior_all.source.ne(prior_all.target)].copy()

          # Case-insensitive mapping to expression gene symbols.
          gene_map={g.upper():g for g in genes}
          prior_all['source_key']=prior_all.source.str.upper()
          prior_all['target_key']=prior_all.target.str.upper()
          prior_all=prior_all[prior_all.source_key.isin(gene_map)&prior_all.target_key.isin(gene_map)].copy()
          prior_all['source_gene']=prior_all.source_key.map(gene_map)
          prior_all['target_gene']=prior_all.target_key.map(gene_map)

          # TF+1000: retain all TF regulators represented by the signed prior,
          # then add the 1000 highest-variance non-TF genes on the selected branch.
          tf_present=sorted(set(prior_all.source_gene))
          gene_to_idx={g:i for i,g in enumerate(genes)}
          # variance after log2(count+1), matching PSD-GRN expression transformation
          L=X.copy().astype(np.float64)
          L.data=np.log2(L.data+1.0)
          n=L.shape[0]
          mean=np.asarray(L.mean(axis=0)).ravel()
          mean2=np.asarray(L.power(2).mean(axis=0)).ravel()
          var=np.maximum(mean2-mean**2,0)
          tf_set=set(tf_present)
          non_tf=[g for g in genes if g not in tf_set]
          non_tf_sorted=sorted(non_tf,key=lambda g:(-var[gene_to_idx[g]],g))
          chosen_non_tf=non_tf_sorted[:1000]
          selected=tf_present+chosen_non_tf
          selected_set=set(selected)

          # Signed reference network restricted to the selected node set.
          pr=prior_all[prior_all.source_gene.isin(selected_set)&prior_all.target_gene.isin(selected_set)].copy()
          pr['pair']=pr.source_gene+'\t'+pr.target_gene
          conflict=set(pr.groupby('pair').sign.nunique().loc[lambda s:s>1].index)
          pr=pr[~pr.pair.isin(conflict)].copy()

          # Collapse duplicate same-sign evidence and preserve provenance.
          def collapse(g):
              srcs=sorted(set(g.source_db.astype(str)))
              confs=sorted(set(g.confidence.astype(str)))
              return pd.Series({'sign':int(g.sign.iloc[0]),'source_db':'+'.join(srcs),'confidence':'+'.join(confs)})
          prov=pr.groupby(['source_gene','target_gene'],sort=True).apply(collapse,include_groups=False).reset_index()
          prov.columns=['source','target','sign','source_db','confidence']
          gold=prov[['source','target','sign']].copy()

          # ExpressionData1000.csv as gene x cell raw counts.
          sel_idx=np.array([gene_to_idx[g] for g in selected],dtype=int)
          Xsel=X[:,sel_idx].T.tocsr()
          expr=pd.DataFrame.sparse.from_spmatrix(Xsel,index=selected,columns=cells)
          expr.to_csv(OUT+'/ExpressionData1000.csv')

          stage=pd.DataFrame({'cell':cells,'state':states,'pseudotime':pt})
          stage.to_csv(OUT+'/stage_label.csv',index=False)
          stage[['cell','pseudotime']].to_csv(OUT+'/PseudoTime.csv',index=False)
          pd.DataFrame({'gene':selected,'type':['TF' if g in tf_set else 'non-TF' for g in selected],
                        'log2_variance':[float(var[gene_to_idx[g]]) for g in selected]}).to_csv(OUT+'/GeneOrdering_TFplus1000.csv',index=False)
          pd.DataFrame({'TF':tf_present}).to_csv(OUT+'/TF_retained.csv',index=False)
          gold.to_csv(OUT+'/gold_augmented.csv',index=False)
          prov.to_csv(OUT+'/gold_augmented_with_provenance.csv',index=False)
          pd.DataFrame(sorted(conflict),columns=['pair']).to_csv(OUT+'/conflicting_pairs_removed.csv',index=False)

          # DPT audit
          order={s:i for i,s in enumerate(target_states)}
          audit_state=stage.groupby('state').pseudotime.agg(['count','min','median','mean','max']).reindex(target_states)
          audit_state.to_csv(OUT+'/state_pseudotime_audit.csv')
          root_cell=str(cells[root])
          act=int((gold.sign==1).sum()); rep=int((gold.sign==-1).sum())
          audit={
            'GEO':'GSE132188',
            'source':'theislab/scvelo_notebooks endocrinogenesis_day15.h5ad',
            'selected_branch':target_states,
            'cells':int(len(cells)),
            'state_counts':{s:int((states==s).sum()) for s in target_states},
            'pseudotime':'Scanpy DPT recomputed on selected branch; n_neighbors=15; use_rep=X_pca; n_dcs=10',
            'root_rule':'Ductal PCA medoid in first 20 PCs',
            'root_cell':root_cell,
            'genes_total_source':int(len(genes)),
            'retained_TFs':int(len(tf_present)),
            'non_TF_genes':int(len(chosen_non_tf)),
            'genes_TFplus1000':int(len(selected)),
            'prior_sources':'DoRothEA mouse A/B/C + TRRUST mouse explicit Activation/Repression',
            'prior_activation_edges':act,
            'prior_repression_edges':rep,
            'prior_recorded_edges':int(len(gold)),
            'conflicting_ordered_pairs_removed':int(len(conflict)),
            'expression_file':'raw counts, gene x cell; PSD-GRN applies log2(x+1) downstream'
          }
          with open(OUT+'/audit.json','w') as f: json.dump(audit,f,indent=2)

          # Keep source files for reproducibility.
          shutil.copy2('source.h5ad',OUT+'/source/GSE132188_E15_5_source.h5ad')
          shutil.copy2('dorothea_mm.rda',OUT+'/source/dorothea_mm.rda')
          shutil.copy2('trrust_rawdata.mouse.tsv',OUT+'/source/trrust_rawdata.mouse.tsv')
          shutil.copy2('build_gse132188.py',OUT+'/scripts/build_gse132188.py')

          # checksums
          rows=[]
          for rootdir,_,fnames in os.walk(OUT):
              for fn in sorted(fnames):
                  p=os.path.join(rootdir,fn)
                  h=hashlib.sha256(open(p,'rb').read()).hexdigest()
                  rows.append({'path':os.path.relpath(p,OUT),'sha256':h,'bytes':os.path.getsize(p)})
          pd.DataFrame(rows).to_csv(OUT+'/checksums.csv',index=False)
          print(json.dumps(audit,indent=2))
          print(audit_state)
          PY
          python build_gse132188.py
          cp build_gse132188.py GSE132188_prepared/scripts/build_gse132188.py
          zip -qr GSE132188_prepared.zip GSE132188_prepared
          sha256sum GSE132188_prepared.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GSE132188_prepared
          path: GSE132188_prepared.zip
          retention-days: 1
