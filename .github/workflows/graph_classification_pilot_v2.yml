name: Graph classification pilot v2

on:
  push:
    branches:
      - graph-classification-pilot-v2
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn torch
      - name: Run leakage-safe matched pilot
        run: |
          python experiments/graph_classification_pilot_v2.py | tee pilot_v2.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-classification-pilot-v2-results
          path: |
            results/graph_classification_pilot_v2/
            pilot_v2.log
